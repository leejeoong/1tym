<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>원타임짐 | ONE TIME GYM</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome (아이콘) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- AOS Animation Library -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    
    <!-- Swiper CSS (슬라이더) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />

    <style>
        /* =========================
           기본 스타일 & 변수
        ========================= */
        :root {
            --bg-color: #0c0d0f;
            --card-bg: #16181d;
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #e63946;
            --primary-hover: #ff4d5d;
            --primary-glow: rgba(230, 57, 70, 0.35);
            --text-main: #ffffff;
            --text-sub: #a0a5b1;
            --accent-gold: #d4af37;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Noto Sans KR', sans-serif;
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            word-break: keep-all;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0c0d0f;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2d35;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        #page-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #08090b;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s ease;
        }

        #page-loader.loaded {
            opacity: 0;
            visibility: hidden;
        }

        .loader-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .loader-logo {
            font-family: 'Montserrat', sans-serif;
            font-size: 32px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 3px;
            margin-bottom: 24px;
            animation: loaderPulse 2s ease-in-out infinite;
        }

        .loader-logo span {
            color: var(--primary);
            text-shadow: 0 0 15px var(--primary-glow);
        }

        .loader-bar-container {
            width: 160px;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .loader-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            position: absolute;
            left: -100%;
            animation: loaderSlide 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes loaderPulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.03); opacity: 1; text-shadow: 0 0 20px rgba(230, 57, 70, 0.4); }
        }

        @keyframes loaderSlide {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .top-event-banner {
            background: linear-gradient(90deg, #111111 0%, #b81d28 50%, #111111 100%);
            color: #fff;
            text-align: center;
            padding: 10px 20px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: -0.3px;
            box-shadow: 0 2px 10px rgba(230, 57, 70, 0.2);
        }

        .top-event-banner strong {
            color: #fff;
            background: rgba(0,0,0,0.3);
            padding: 2px 8px;
            border-radius: 20px;
            margin-right: 6px;
        }

        .site-logo {
            position: absolute;
            top: 55px;
            left: 40px;
            display: inline-block;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .site-logo:hover {
            transform: scale(1.03);
        }

        .site-logo img {
            width: 150px;
            height: auto;
            display: block;
        }

        .hero-section {
            padding: 90px 20px 80px;
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero-swiper-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .hero-swiper-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: 1;
            pointer-events: none;
        }

        .hero-swiper {
            width: 100%;
            height: 100%;
        }

        .hero-swiper .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .hero-btn-next,
        .hero-btn-prev {
            color: rgba(255, 255, 255, 0.4) !important;
            transition: color 0.3s ease;
            z-index: 10 !important;
        }

        .hero-btn-next:hover,
        .hero-btn-prev:hover {
            color: #ffffff !important;
        }

        .hero-label, .hero-section h1, .hero-subtitle {
            position: relative;
            z-index: 2;
        }

        .hero-label {
            color: var(--primary);
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 20px;
            background: rgba(230, 57, 70, 0.1);
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid rgba(230, 57, 70, 0.3);
        }

        h1 {
            font-size: 52px;
            margin: 0 0 16px;
            color: var(--text-main);
            font-weight: 900;
            letter-spacing: -1.5px;
            line-height: 1.25;
        }

        h1 span {
            background: linear-gradient(135deg, #fff 30%, #a0a5b1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            color: var(--text-sub);
            margin-bottom: 50px;
            font-size: 17px;
            max-width: 650px;
            font-weight: 400;
        }

        section {
            max-width: 1050px;
            margin: 0 auto;
            padding: 90px 20px;
        }

        section.hero-section {
            max-width: 100%;
        }

        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-header .sub-tag {
            color: var(--primary);
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: block;
            margin-bottom: 10px;
        }

        .section-title {
            font-size: 34px;
            color: #ffffff;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 12px;
        }

        .section-subtitle {
            color: var(--text-sub);
            font-size: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .tapdong-hero {
            background: linear-gradient(135deg, #18191e 0%, #2a1215 100%);
            border: 1px solid var(--primary);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: left;
            box-shadow: 0 10px 40px rgba(230, 57, 70, 0.18);
            position: relative;
            overflow: hidden;
        }

        .tapdong-hero h2 {
            margin: 0 0 15px;
            font-size: 30px;
            color: #ffffff;
            font-weight: 800;
        }

        .tapdong-hero .highlight {
            color: var(--primary);
        }

        .tapdong-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 35px;
        }

        .tapdong-feature-box {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 14px;
            padding: 22px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.3s;
        }

        .tapdong-feature-box:hover {
            background: rgba(0, 0, 0, 0.5);
        }

        .tapdong-feature-box h4 {
            color: #ffffff;
            font-size: 16px;
            margin: 0 0 8px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tapdong-feature-box p {
            color: var(--text-sub);
            font-size: 13px;
            margin: 0;
            line-height: 1.6;
        }

        .facility-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
            margin-bottom: 90px;
        }

        .facility-row.reverse {
            flex-direction: row-reverse;
        }

        .facility-text {
            flex: 1;
        }

        .facility-text .en-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 26px;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 12px;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        .facility-text h3 {
            font-size: 22px;
            color: #ffffff;
            margin: 0 0 16px;
            font-weight: 700;
        }

        .facility-text p {
            font-size: 15px;
            color: var(--text-sub);
            line-height: 1.7;
            margin: 0;
        }

        .facility-img-box {
            flex: 1.2;
            overflow: hidden;
            border-radius: 18px;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            width: 100%;
        }

        .facility-img-box img {
            width: 100%;
            aspect-ratio: 16 / 10;
            object-fit: cover;
            object-position: center;
            display: block;
            filter: grayscale(100%) brightness(0.85);
            transition: filter 0.5s ease, transform 0.5s ease;
        }

        .facility-img-box:hover img {
            filter: grayscale(0%) brightness(1);
            transform: scale(1.05);
        }

        .tour-section {
            background: rgba(255, 255, 255, 0.015);
            border-top: 1px solid var(--card-border);
            border-bottom: 1px solid var(--card-border);
            max-width: 100%;
        }

        .tour-container {
            max-width: 1050px;
            margin: 0 auto;
        }

        .swiper-facility {
            padding-bottom: 50px !important;
        }

        .swiper-slide-facility {
            border-radius: 16px;
            overflow: hidden;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
        }

        .swiper-slide-facility img {
            width: 100%;
            aspect-ratio: 16 / 10;
            object-fit: cover;
            object-position: center;
            display: block;
            filter: grayscale(100%) brightness(0.85);
            transition: filter 0.5s ease, transform 0.5s ease;
        }

        .swiper-slide-facility:hover img {
            filter: grayscale(0%) brightness(1);
            transform: scale(1.05);
        }

        /* 설명 제거에 따른 슬라이드 캡션 영역 숨김 처리 */
        .slide-caption {
            display: none;
        }

        .swiper-pagination-bullet-active {
            background: var(--primary) !important;
        }

        /* 3열로 변경된 트레이너 영역 */
        .trainer-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
        }

        .trainer-card {
            background: var(--card-bg);
            border-radius: 18px;
            width: 100%;
            overflow: hidden;
            border: 1px solid var(--card-border);
            transition: all 0.35s ease;
        }

        .trainer-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
        }

        .trainer-img-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            overflow: hidden;
            background-color: #1a1c23;
        }

        .trainer-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            transition: transform 0.4s ease;
        }

        .trainer-card:hover .trainer-img {
            transform: scale(1.06);
        }

        .trainer-info {
            padding: 20px 16px;
            text-align: left;
        }

        .trainer-name {
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 4px 0;
            color: #ffffff;
        }

        .trainer-tags {
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .trainer-desc {
            font-size: 12.5px;
            color: var(--text-sub);
            line-height: 1.5;
            margin: 0;
        }

        .review-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 28px;
            text-align: left;
            position: relative;
        }

        .review-stars {
            color: #ffb703;
            font-size: 14px;
            margin-bottom: 14px;
        }

        .review-text {
            font-size: 14px;
            color: #e2e8f0;
            line-height: 1.7;
            margin-bottom: 20px;
            font-style: italic;
        }

        .review-author {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .author-avatar {
            width: 42px;
            height: 42px;
            background: #2a2d35;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-weight: bold;
        }

        .author-info h5 {
            color: #fff;
            font-size: 14px;
            margin: 0;
            font-weight: 700;
        }

        .author-info span {
            color: var(--text-sub);
            font-size: 12px;
        }

        .faq-accordion {
            max-width: 800px;
            margin: 0 auto;
        }

        .faq-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            margin-bottom: 16px;
            overflow: hidden;
            transition: border-color 0.3s;
        }

        .faq-item:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .faq-question {
            padding: 22px 25px;
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .faq-question i {
            color: var(--primary);
            transition: transform 0.3s ease;
        }

        .faq-answer {
            max-height: 0;
            overflow: hidden;
            padding: 0 25px;
            color: var(--text-sub);
            font-size: 14px;
            line-height: 1.7;
            transition: all 0.3s cubic-bezier(0, 1, 0, 1);
            background: rgba(0, 0, 0, 0.2);
        }

        .faq-item.active .faq-answer {
            max-height: 300px;
            padding: 0 25px 22px 25px;
            transition: all 0.3s cubic-bezier(1, 0, 1, 0);
        }

        .faq-item.active .faq-question i {
            transform: rotate(180deg);
        }

        .location-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .location-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 35px;
            width: 460px;
            text-align: left;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }

        .location-card h3 {
            font-size: 21px;
            color: #ffffff;
            margin: 0 0 18px 0;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .location-info {
            font-size: 14px;
            color: var(--text-sub);
            line-height: 1.9;
            margin-bottom: 25px;
        }

        .location-info strong {
            color: #ffffff;
            margin-right: 8px;
        }

        .location-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1;
            padding: 15px 0;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
            box-sizing: border-box;
            text-align: center;
        }

        .btn-reserve {
            background: linear-gradient(135deg, var(--primary) 0%, #b81d28 100%);
            color: #ffffff;

        .btn-reserve:hover {
