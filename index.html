<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYMBOXX 스타일 홈페이지</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Apple SD Gothic Neo', sans-serif;
            background-color: #111;
            color: #fff;
        }

        /* 헤더 스타일 */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
        }

        .logo img {
            height: 24px;
            object-fit: contain;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: #ccc;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover, nav a.active {
            color: #ff3b30;
        }

        .app-download-btn {
            background-color: #ff3b30;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        /* 메인 슬라이더 배너 스타일 */
        .hero-slider {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            padding-left: 80px;
        }

        .slide.active {
            opacity: 1;
            z-index: 1;
        }

        /* 어두운 배경 느낌 (오버레이) - 마우스오버 시 컬러 변환 효과 제거 */
        .slide::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55); /* 전체적으로 톤다운된 무게감 있는 배경 */
            z-index: 1;
        }

        .slide-content {
            position: relative;
            z-index: 2;
            max-width: 600px;
        }

        .slide-content h1 {
            font-size: 52px;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 25px;
            letter-spacing: -1px;
        }

        .store-buttons {
            display: flex;
            gap: 12px;
        }

        .store-btn {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* 슬라이드 좌우 화살표 버튼 */
        .slider-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.4);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .slider-arrow:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        .prev-btn { left: 30px; }
        .next-btn { right: 30px; }
    </style>
</head>
<body>

    <!-- 헤더 영역 -->
    <header>
        <div class="logo">
            <!-- 요청하신 newlogo.png 적용 -->
            <a href="#"><img src="newlogo.png" alt="GYMBOXX 로고"></a>
        </div>
        <nav>
            <a href="#">브랜드</a>
            <a href="#" class="active">지점 찾기</a>
            <a href="#">기구 찾기</a>
            <a href="#">트레이너 찾기</a>
            <a href="#">채용</a>
        </nav>
        <a href="#" class="app-download-btn">앱 다운로드</a>
    </header>

    <!-- 메인 슬라이드 배너 영역 -->
    <section class="hero-slider">
        <!-- 슬라이드 1 -->
        <div class="slide active" style="background-image: url('image_c994a3.jpg');">
            <div class="slide-content">
                <h1>YOUR JOURNEY,<br>YOUR DESTINATION.</h1>
                <div class="store-buttons">
                    <a href="#" class="store-btn"> App store</a>
                    <a href="#" class="store-btn">G Google Play</a>
                </div>
            </div>
        </div>

        <!-- 슬라이드 2 (필요시 이미지 경로 변경해서 추가 가능) -->
        <div class="slide" style="background-image: url('image_c994a3.jpg');">
            <div class="slide-content">
                <h1>LIMITLESS STRENGTH,<br>ENDLESS POWER.</h1>
                <div class="store-buttons">
                    <a href="#" class="store-btn"> App store</a>
                    <a href="#" class="store-btn">G Google Play</a>
                </div>
            </div>
        </div>

        <!-- 좌우 넘기기 버튼 -->
        <button class="slider-arrow prev-btn">&#10094;</button>
        <button class="slider-arrow next-btn">&#10095;</button>
    </section>

    <!-- 슬라이드 작동 스크립트 -->
    <script>
        const slides = document.querySelectorAll('.slide');
        const prevBtn = document.querySelector('.prev-btn');
        const nextBtn = document.querySelector('.next-btn');
        let currentIndex = 0;

        function showSlide(index) {
            slides.forEach(slide => slide.classList.remove('active'));
            slides[index].classList.add('active');
        }

        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % slides.length;
            showSlide(currentIndex);
        });

        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + slides.length) % slides.length;
            showSlide(currentIndex);
        });
    </script>

</body>
</html>
