<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONE TIME GYM - 원타임짐</title>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #e31b23;
            --bg-dark: #0c0d0f;
            --bg-card: #16181c;
            --text-main: #ffffff;
            --text-sub: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* =========================
           1. 로딩 화면 (Dumbbell Loader)
        ========================= -->
        #page-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0c0d0f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #page-loader.loaded {
            opacity: 0;
            visibility: hidden;
        }

        .loader-logo {
            font-family: 'Montserrat', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .loader-logo span {
            color: var(--primary);
        }

        /* 덤벨 아이콘 로더 애니메이션 */
        .bone-loader {
            font-size: 40px;
            color: var(--primary);
            animation: bounceDumbbell 0.8s ease-in-out infinite alternate;
            margin-bottom: 15px;
        }

        @keyframes bounceDumbbell {
            0% {
                transform: translateY(0) rotate(0deg);
                text-shadow: 0 0 10px rgba(227, 27, 35, 0.2);
            }
            100% {
                transform: translateY(-15px) rotate(15deg);
                text-shadow: 0 0 25px rgba(227, 27, 35, 0.6);
            }
        }

        .loader-text {
            font-size: 13px;
            color: var(--text-sub);
            letter-spacing: 1px;
            font-family: 'Montserrat', sans-serif;
        }

        /* =========================
           2. 기본 레이아웃 스타일
        ========================= -->
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(12, 13, 15, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .logo {
            font-family: 'Montserrat', sans-serif;
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            text-decoration: none;
        }

        .logo span {
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        /* 메인 허브 섹션 */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
        }

        .hero h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .hero h1 span {
            color: var(--primary);
        }

        .hero p {
            font-size: 18px;
            color: var(--text-sub);
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: var(--primary);
            color: white;
            font-weight: 700;
            text-decoration: none;
            border-radius: 4px;
            transition: background 0.3s, transform 0.2s;
        }

        .btn:hover {
            background-color: #c5141b;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- 1. 로딩 화면 HTML -->
    <div id="page-loader">
        <div class="loader-logo">ONE TIME <span>GYM</span></div>
        <div class="bone-loader">
            <i class="fa-solid fa-dumbbell"></i>
        </div>
        <div class="loader-text">Loading the best workout...</div>
    </div>

    <!-- 헤더 영역 -->
    <header>
        <a href="#" class="logo">ONE TIME <span>GYM</span></a>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Programs</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <section class="hero">
        <h1>PUSH YOUR <span>LIMITS</span></h1>
        <p>당신의 한계를 깨부수는 단 한 번의 기회, 원타임짐과 함께하세요.</p>
        <a href="#" class="btn">지금 시작하기</a>
    </section>

    <!-- 로딩 해제 스크립트 -->
    <script>
        window.addEventListener('load', function() {
            const loader = document.getElementById('page-loader');
            // 페이지가 완전히 로드되면 fade-out 클래스(.loaded) 추가
            setTimeout(() => {
                loader.classList.add('loaded');
            }, 500); // 0.5초 대기 후 부드럽게 사라짐
        });
    </script>
</body>
</html>
