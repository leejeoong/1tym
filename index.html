<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>원타임짐</title>
    <style>
        body {
            background-color: #fcfbfa;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            text-align: center;
            margin: 0;
            padding: 50px 20px;
            color: #222;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 15px;
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto 40px auto;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            width: 280px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            text-align: left;
            position: relative;
            border: 1px solid #eee;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card.dark {
            background: #11221b;
            color: #fff;
            border: none;
        }
        .badge {
            font-size: 11px;
            font-weight: bold;
            color: #8c734b;
            margin-bottom: 15px;
            display: block;
        }
        .card.dark .badge {
            color: #d4af37;
        }
        .card h3 {
            font-size: 22px;
            margin: 0 0 10px 0;
        }
        .card p {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .card.dark p {
            color: #ccc;
        }
        .link-text {
            font-size: 13px;
            font-weight: bold;
            color: #222;
            text-decoration: none;
            display: block;
            text-align: right;
        }
        .card.dark .link-text {
            color: #fff;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }
        .btn {
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }
        .btn-reserve { background-color: #d4af37; color: #fff; }
        .btn-kakao { background-color: #ffe812; color: #222; }
        .btn-call { background-color: #111; color: #fff; }
    </style>
</head>
<body>

    <h1>원하는 지점을 선택하세요</h1>
    <div class="subtitle">가까운 원타임짐 지점을 선택하면 해당 지점 소개로 바로 이동합니다.</div>

    <!-- 지점 카드 영역 -->
    <div class="container">
        <!-- 1호점 -->
        <div class="card">
            <span class="badge">1ST BRANCH</span>
            <h3>원타임짐 탑동점</h3>
            <p>탑동초등학교, 구운중학교 근처 </p>
            <a href="#" class="link-text">시설 보기 →</a>
        </div>

        <!-- 2호점 -->
        <div class="card">
            <span class="badge">2ND BRANCH</span>
            <h3>원타임짐 오산점</h3>
            <p>N마트 맞은 편 </p>
            <a href="#" class="link-text">시설 보기 →</a>
        </div>

    </div>

    <!-- 하단 문의 버튼 영역 -->
    <div class="buttons">
        <a href="#" class="btn btn-reserve">예약하기</a>
        <a href="#" class="btn btn-kakao">카카오 문의</a>
        <a href="#" class="btn btn-call">전화하기</a>
    </div>

</body>
</html>
